replicaCount: 1

image:
  repository: coding-agent
  tag: latest
  pullPolicy: IfNotPresent

server:
  host: 0.0.0.0
  port: 8080

command: []

service:
  type: ClusterIP
  port: 8080

agent:
  dataDir: /var/lib/coding-agent/data
  extraEnv: []
  secretRef: []
  secretEnv: []
  config:
    model: gpt-4.1
    provider: copilot
    approvalPolicy: auto
    maxTurns: 30
    subagentTimeout: 30.0
    shell:
      sandboxMode: native
      cpuLimitSeconds: 10
      memoryLimitMb: null
      dockerImage: python:3.11-slim

probes:
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 2
    failureThreshold: 3

resources: {}
podAnnotations: {}
podSecurityContext:
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001

persistence:
  workspace:
    enabled: true
    existingClaim: ""
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    mountPath: /workspace
  data:
    enabled: true
    existingClaim: ""
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    mountPath: /var/lib/coding-agent/data

redis:
  enabled: false
  url: ""
  sidecar:
    enabled: true
    image: redis:7-alpine
    port: 6379
    args:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
    resources: {}

sandbox:
  sidecar:
    enabled: false
    image: busybox:1.36
    command:
      - sh
      - -c
      - sleep infinity
    configPath: /etc/nsjail/nsjail.cfg
    config: |
      name: "coding-agent"
      mode: o
      cwd: "/workspace"
      bindmount: ["/workspace:/workspace"]
      time_limit: 10
