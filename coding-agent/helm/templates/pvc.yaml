{{- if and .Values.persistence.workspace.enabled (eq .Values.persistence.workspace.existingClaim "") }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "coding-agent.fullname" . }}-workspace
  labels:
    {{- include "coding-agent.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.workspace.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.persistence.workspace.size }}
  {{- if .Values.persistence.workspace.storageClassName }}
  storageClassName: {{ .Values.persistence.workspace.storageClassName }}
  {{- end }}
{{- end }}
{{- if and .Values.persistence.data.enabled (eq .Values.persistence.data.existingClaim "") }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "coding-agent.fullname" . }}-data
  labels:
    {{- include "coding-agent.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.data.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.persistence.data.size }}
  {{- if .Values.persistence.data.storageClassName }}
  storageClassName: {{ .Values.persistence.data.storageClassName }}
  {{- end }}
{{- end }}
