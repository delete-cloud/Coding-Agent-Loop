apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "coding-agent.fullname" . }}-agent-config
  labels:
    {{- include "coding-agent.labels" . | nindent 4 }}
data:
  agent.toml: |
    [agent]
    name = "coding-agent"
    model = {{ .Values.agent.config.model | quote }}
    provider = {{ .Values.agent.config.provider | quote }}
    {{- if .Values.agent.config.baseUrl }}
    base_url = {{ .Values.agent.config.baseUrl | quote }}
    {{- end }}
    system_prompt = """You are a skilled coding assistant. You help users write, debug, and improve code.
    You have access to file operations, shell commands, and search tools.
    Always explain your reasoning before making changes."""
    max_turns = {{ .Values.agent.config.maxTurns }}

    [server]
    host = {{ .Values.server.host | quote }}
    port = {{ .Values.server.port }}
    {{- if .Values.server.auth.enabled }}
    bearer_token_env = {{ required "server.auth.bearerTokenEnv is required when server.auth.enabled=true" .Values.server.auth.bearerTokenEnv | quote }}
    {{- if .Values.server.auth.adminBearerTokenEnv }}
    admin_bearer_token_env = {{ .Values.server.auth.adminBearerTokenEnv | quote }}
    {{- end }}
    {{- end }}

    [agent.plugins]
    enabled = [
      "llm_provider",
      "storage",
      "core_tools",
      "approval",
      "doom_detector",
      "parallel_executor",
      "summarizer",
      "memory",
      "session_metrics",
      "shell_session",
      "skills",
      {{- if .Values.memory.semantic.enabled }}
      "semantic_memory",
      {{- end }}
      {{- if .Values.kb.enabled }}
      "kb",
      {{- end }}
    ]

    [storage]
    tape_backend = "sqlite"
    http_session_backend = "sqlite"
    checkpoint_backend = "sqlite"
    runtime_backend = "sqlite"
    doc_backend = "lancedb"

    [storage.paths]
    local = {{ printf "%s/local.sqlite3" .Values.persistence.data.mountPath | quote }}
    docs = {{ printf "%s/docs" .Values.persistence.data.mountPath | quote }}

    {{- if .Values.memory.semantic.enabled }}
    [memory.semantic]
    enabled = true
    backend = {{ .Values.memory.semantic.backend | quote }}
    db_path = {{ printf "%s/%s" (.Values.persistence.data.mountPath | trimSuffix "/") (.Values.memory.semantic.dbPath | trimPrefix "/") | quote }}
    table_name = {{ .Values.memory.semantic.tableName | quote }}
    embedding_provider_id = {{ .Values.memory.semantic.embeddingProviderId | quote }}
    embedding_model = {{ .Values.memory.semantic.embeddingModel | quote }}
    embedding_dim = {{ .Values.memory.semantic.embeddingDim }}
    {{- if .Values.memory.semantic.embeddingBaseUrl }}
    embedding_base_url = {{ .Values.memory.semantic.embeddingBaseUrl | quote }}
    {{- end }}

    {{- end }}

    {{- if .Values.kb.enabled }}
    [kb]
    db_path = {{ printf "%s/%s" (.Values.persistence.data.mountPath | trimSuffix "/") (.Values.kb.dbPath | trimPrefix "/") | quote }}
    embedding_model = {{ .Values.kb.embeddingModel | quote }}
    {{- if .Values.kb.embeddingBaseUrl }}
    embedding_base_url = {{ .Values.kb.embeddingBaseUrl | quote }}
    {{- end }}
    embedding_dim = {{ .Values.kb.embeddingDim }}
    {{- if ne .Values.kb.maxDistance nil }}
    max_distance = {{ .Values.kb.maxDistance }}
    {{- end }}
    corpus = {{ .Values.kb.corpus | quote }}
    search_corpora = {{ .Values.kb.searchCorpora | toJson }}
    {{- end }}

    [approval]
    policy = {{ .Values.agent.config.approvalPolicy | quote }}
    blocked_tools = []

    [subagent]
    timeout = {{ .Values.agent.config.subagentTimeout }}

    [shell]
    sandbox_mode = {{ .Values.agent.config.shell.sandboxMode | quote }}
    cpu_limit_seconds = {{ .Values.agent.config.shell.cpuLimitSeconds }}
    {{- if .Values.agent.config.shell.memoryLimitMb }}
    memory_limit_mb = {{ .Values.agent.config.shell.memoryLimitMb }}
    {{- end }}
    docker_image = {{ .Values.agent.config.shell.dockerImage | quote }}

    [web_search]
    backend = "mock"

    [summarizer]
    max_entries = 100
    keep_recent = 20

    [topic]
    overlap_threshold = 0.2
    min_entries_before_detect = 4

    {{- if .Values.observability.enabled }}
    [observability]
    enabled = true
    backend = {{ required "observability.backend is required when observability.enabled=true" .Values.observability.backend | quote }}
    {{- if and .Values.observability.endpoint .Values.observability.endpointEnv }}
    {{- fail "observability.endpoint and observability.endpointEnv cannot both be set" }}
    {{- end }}
    {{- if .Values.observability.endpoint }}
    endpoint = {{ required "observability.endpoint is required when observability.enabled=true" .Values.observability.endpoint | quote }}
    {{- else if .Values.observability.endpointEnv }}
    endpoint_env = {{ .Values.observability.endpointEnv | quote }}
    {{- else }}
    {{- fail "observability.endpoint or observability.endpointEnv is required when observability.enabled=true" }}
    {{- end }}
    timeout_seconds = {{ .Values.observability.timeoutSeconds }}
    public_key_env = {{ .Values.observability.publicKeyEnv | quote }}
    secret_key_env = {{ .Values.observability.secretKeyEnv | quote }}
    {{- with .Values.observability.headers }}

    [observability.headers]
    {{- range $key, $value := . }}
    {{ $key | quote }} = {{ $value | quote }}
    {{- end }}
    {{- end }}
    {{- end }}
