image:
  repository: <registry>/<namespace>/coding-agent
  tag: main
  pullPolicy: IfNotPresent

server:
  allowUnauthenticated: false
  auth:
    enabled: true
    bearerTokenEnv: CODING_AGENT_API_KEY
    secretName: coding-agent-coding-agent-api-key
    secretKey: api-key
    adminBearerTokenEnv: ""
    adminSecretName: ""
    adminSecretKey: api-key

cors:
  origins:
    - https://<agent-host>

service:
  type: NodePort
  port: 8080
  # Example only. Pick an available NodePort in the target cluster.
  nodePort: 30080

agent:
  secretRef:
    - <provider-secret>
    - <observability-secret>
    # The KB embedding client reads OPENAI_API_KEY. Put that key in a private
    # secret and include it here, or wire it with agent.secretEnv below.
    # - <kb-embedding-secret>
  # secretEnv:
  #   - name: OPENAI_API_KEY
  #     secretName: <kb-embedding-secret>
  #     secretKey: api-key
  config:
    # Example OpenAI-compatible provider settings. Replace for the target runtime.
    provider: openai
    model: gpt-4.1
    approvalPolicy: auto
    maxTurns: 30
    subagentTimeout: 30.0
    shell:
      sandboxMode: native
      cpuLimitSeconds: 10
      memoryLimitMb: null
      dockerImage: python:3.11-slim

# kb:
#   enabled: true
#   dbPath: kb
#   embeddingModel: BAAI/bge-m3
#   embeddingBaseUrl: https://api.siliconflow.cn/v1
#   embeddingDim: 1024
#   maxDistance: null
#   corpus: notes
#   searchCorpora:
#     - sre
#     - notes
#   index:
#     enabled: true
#     schedule: "0 * * * *"
#     gitRef: main
#     gitSecretName: <kb-git-secret>
#     repos:
#       - name: sre
#         corpus: sre
#         url: "<forgejo-host>/<owner>/sre.git"

observability:
  enabled: true
  backend: langfuse
  endpointEnv: <observability-endpoint-env>
  publicKeyEnv: <observability-public-key-env>
  secretKeyEnv: <observability-secret-key-env>

networkPolicy:
  extraEgress:
    # Private deployments should add the git host CIDR needed by kb.index.repos.
    - to:
        - ipBlock:
            cidr: <git-host-cidr>/32
      ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: <observability-host-ip>/32
      ports:
        - protocol: TCP
          port: 443

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 2Gi
