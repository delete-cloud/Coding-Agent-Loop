groups:
  - name: coding-agent-observability
    rules:
      - alert: CodingAgentMetricsEndpointDown
        expr: up{job="coding-agent"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Coding Agent metrics endpoint is unavailable
          description: Prometheus has not scraped the local Coding Agent metrics endpoint successfully for two minutes.

      - alert: CodingAgentHttpErrorRateHigh
        expr: |
          (
            sum(rate(coding_agent_http_requests_total{status_code=~"5.."}[5m]))
            /
            clamp_min(sum(rate(coding_agent_http_requests_total[5m])), 1)
          ) > 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Coding Agent HTTP 5xx rate is high
          description: More than ten percent of local Coding Agent HTTP requests are returning 5xx responses.

      - alert: CodingAgentObservationErrorSpansPresent
        expr: sum(rate(coding_agent_observation_spans_total{status="error"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Coding Agent observation spans report errors
          description: Local runtime, context, action, or tool spans are reporting error status.

      - alert: CodingAgentStorageErrorsPresent
        expr: sum(rate(coding_agent_storage_operations_total{storage_status="error"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Coding Agent storage operations report errors
          description: Local storage operation metrics include error outcomes.
