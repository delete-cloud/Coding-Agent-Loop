when:
  - event:
      - push
      - pull_request
      - manual

steps:
  lint:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    environment:
      UV_NO_WATCHER: "1"
    commands:
      - cd coding-agent
      - uv sync --all-extras
      - uv run ruff check src tests

  smoke-tests:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    environment:
      UV_NO_WATCHER: "1"
    commands:
      - cd coding-agent
      - uv sync --all-extras
      - uv run pytest tests/ui/test_server_compat_imports.py tests/coding_agent/test_agent_observability.py tests/coding_agent/test_bee_template_pack_smoke.py -q

  build-image:
    image: gcr.io/kaniko-project/executor:v1.24.0-debug
    environment:
      REGISTRY_USERNAME:
        from_secret: registry_username
      REGISTRY_PASSWORD:
        from_secret: registry_password
    commands:
      - mkdir -p /kaniko/.docker
      - auth="$(printf '%s:%s' "$REGISTRY_USERNAME" "$REGISTRY_PASSWORD" | base64 | tr -d '\n')"
      - printf '{"auths":{"git.mesh.kinaz.me":{"auth":"%s"}}}\n' "$auth" > /kaniko/.docker/config.json
      - /kaniko/executor --context "$CI_WORKSPACE/coding-agent" --dockerfile "$CI_WORKSPACE/coding-agent/Dockerfile" --destination "git.mesh.kinaz.me/kina/coding-agent:${CI_COMMIT_SHA}" --destination "git.mesh.kinaz.me/kina/coding-agent:main"
    when:
      - event:
          - push
          - manual
        branch: main
