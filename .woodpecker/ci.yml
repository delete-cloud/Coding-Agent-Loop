when:
  - event:
      - manual
      - push
      - pull_request

steps:
  lint-and-smoke-tests:
    image: python:3.12-slim
    environment:
      PIP_DEFAULT_TIMEOUT: "120"
      PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple
      PIP_CACHE_DIR: /cache/pip/coding-agent-loop
    volumes:
      - woodpecker-runner-cache:/cache
    commands:
      - cd coding-agent
      - mkdir -p "$PIP_CACHE_DIR"
      - python -m pip install -e '.[dev,redis]' ruff
      - ruff check src/coding_agent/observability/ src/coding_agent/ui/http_server.py src/coding_agent/ui/session_manager.py tests/ui/test_server_compat_imports.py tests/coding_agent/test_agent_observability.py tests/coding_agent/test_bee_template_pack_smoke.py
      - pytest tests/ui/test_server_compat_imports.py tests/coding_agent/test_agent_observability.py tests/coding_agent/test_bee_template_pack_smoke.py -q

  build-image:
    image: gcr.io/kaniko-project/executor:v1.24.0-debug
    environment:
      REGISTRY_USERNAME:
        from_secret: registry_username
      REGISTRY_PASSWORD:
        from_secret: registry_password
      http_proxy:
        from_secret: proxy_url
      https_proxy:
        from_secret: proxy_url
      HTTP_PROXY:
        from_secret: proxy_url
      HTTPS_PROXY:
        from_secret: proxy_url
      PIP_DEFAULT_TIMEOUT: "120"
      PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple
      UV_DEFAULT_INDEX: https://mirrors.aliyun.com/pypi/simple
      NODE_BASE_IMAGE: git.mesh.kinaz.me/kina/node:20-alpine
      APT_DEBIAN_MIRROR: https://mirrors.aliyun.com/debian
      APT_DEBIAN_SECURITY_MIRROR: https://mirrors.aliyun.com/debian-security
      no_proxy: git.mesh.kinaz.me,localhost,127.0.0.1,.svc,.cluster.local,10.0.0.0/8,192.168.0.0/16
      NO_PROXY: git.mesh.kinaz.me,localhost,127.0.0.1,.svc,.cluster.local,10.0.0.0/8,192.168.0.0/16
    commands:
      - mkdir -p /kaniko/.docker
      - auth="$(printf '%s:%s' "$REGISTRY_USERNAME" "$REGISTRY_PASSWORD" | base64 | tr -d '\n')"
      - printf '{"auths":{"git.mesh.kinaz.me":{"auth":"%s"}}}\n' "$auth" > /kaniko/.docker/config.json
      - /kaniko/executor --context "$CI_WORKSPACE/coding-agent" --dockerfile "$CI_WORKSPACE/coding-agent/Dockerfile" --cache=true --cache-repo "git.mesh.kinaz.me/kina/coding-agent/cache" --build-arg NODE_BASE_IMAGE="$NODE_BASE_IMAGE" --build-arg PYTHON_BASE_IMAGE=git.mesh.kinaz.me/kina/python:3.12-slim --build-arg PIP_DEFAULT_TIMEOUT="$PIP_DEFAULT_TIMEOUT" --build-arg PIP_INDEX_URL="$PIP_INDEX_URL" --build-arg UV_DEFAULT_INDEX="$UV_DEFAULT_INDEX" --build-arg APT_DEBIAN_MIRROR="$APT_DEBIAN_MIRROR" --build-arg APT_DEBIAN_SECURITY_MIRROR="$APT_DEBIAN_SECURITY_MIRROR" --destination "git.mesh.kinaz.me/kina/coding-agent:${CI_COMMIT_SHA}" --destination "git.mesh.kinaz.me/kina/coding-agent:main"
    when:
      - event:
          - push
        branch: main

  build-deploy-tools:
    image: gcr.io/kaniko-project/executor:v1.24.0-debug
    environment:
      REGISTRY_USERNAME:
        from_secret: registry_username
      REGISTRY_PASSWORD:
        from_secret: registry_password
      http_proxy:
        from_secret: proxy_url
      https_proxy:
        from_secret: proxy_url
      HTTP_PROXY:
        from_secret: proxy_url
      HTTPS_PROXY:
        from_secret: proxy_url
      APT_DEBIAN_MIRROR: https://mirrors.aliyun.com/debian
      APT_DEBIAN_SECURITY_MIRROR: https://mirrors.aliyun.com/debian-security
      no_proxy: git.mesh.kinaz.me,localhost,127.0.0.1,.svc,.cluster.local,10.0.0.0/8,192.168.0.0/16
      NO_PROXY: git.mesh.kinaz.me,localhost,127.0.0.1,.svc,.cluster.local,10.0.0.0/8,192.168.0.0/16
    commands:
      - mkdir -p /kaniko/.docker
      - auth="$(printf '%s:%s' "$REGISTRY_USERNAME" "$REGISTRY_PASSWORD" | base64 | tr -d '\n')"
      - printf '{"auths":{"git.mesh.kinaz.me":{"auth":"%s"}}}\n' "$auth" > /kaniko/.docker/config.json
      - /kaniko/executor --context "$CI_WORKSPACE" --dockerfile "$CI_WORKSPACE/docker/deploy-tools.Dockerfile" --build-arg PYTHON_BASE_IMAGE=git.mesh.kinaz.me/kina/python:3.12-slim --build-arg APT_DEBIAN_MIRROR="$APT_DEBIAN_MIRROR" --build-arg APT_DEBIAN_SECURITY_MIRROR="$APT_DEBIAN_SECURITY_MIRROR" --destination "git.mesh.kinaz.me/kina/coding-agent-deploy-tools:kubectl-1.36.0-helm-3.17.3-python-3.12-slim"
    when:
      - event:
          - manual
        branch: main
