when:
  - event: manual
    branch: main

steps:
  deploy-o6n:
    image: git.mesh.kinaz.me/kina/coding-agent-deploy-tools:kubectl-1.36.0-python-3.12-slim
    environment:
      KUBECONFIG_CONTENT:
        from_secret: kubeconfig
      IMAGE_REPOSITORY: git.mesh.kinaz.me/kina/coding-agent
      IMAGE_TAG: ${CI_COMMIT_SHA}
      K8S_NAMESPACE: coding-agent-deepseek
      K8S_DEPLOYMENT: coding-agent-coding-agent
      K8S_CONTAINER: coding-agent
      ROLLOUT_TIMEOUT: 420s
      ENABLE_POD_HEALTH_SMOKE: "1"
    commands:
      - ./scripts/deploy-coding-agent-k8s.sh
